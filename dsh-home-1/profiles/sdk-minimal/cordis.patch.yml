# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

- insert:
    - id: mysql-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: mysql
        command: uvx
        args:
          - atengk-mcp-server-rdbms
        env:
          MCP_RDBMS_DIALECT: mysql
          MCP_RDBMS_DB_HOST: !!js process.env.MCP_RDBMS_DB_HOST
          MCP_RDBMS_DB_PORT: !!js process.env.MCP_RDBMS_DB_PORT
          MCP_RDBMS_USER: !!js process.env.MCP_RDBMS_USER
          MCP_RDBMS_PASSWORD: !!js process.env.MCP_RDBMS_PASSWORD
          MCP_RDBMS_DATABASE: !!js process.env.MCP_RDBMS_DATABASE
        toolCallTimeoutMs: 30000
        failOnStartupError: true
    - id: wxc-test
      name: '../../../plugins/wxc-test.ts'
