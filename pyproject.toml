[project]
name = "dsh-py-demo"
version = "0.1.0"
description = "DSH-powered metadata analysis service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepseek-harness-sdk>=0.1.5rc1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20",
    "mcp>=1.12,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pymysql>=1.1,<2",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "cryptography>=44",
    "python-dotenv>=1.0",
    "regex>=2024.11.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
